<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagan - Future Soldier 🇮🇳</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            background: linear-gradient(135deg, #ff9933 0%, #ffffff 50%, #138808 100%);
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 3px solid #000080;
        }
        h1 {
            color: #FF4500;
            font-size: 38px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #000080;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .profile-pic {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 6px solid #FF4500;
            object-fit: cover;
            margin: 20px auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .btn {
            background: linear-gradient(45deg, #000080, #138808);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
        }
        footer {
            margin-top: 20px;
            color: #000080;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>जय हिंद! मैं Gagan हूं 🇮🇳</h1>
        <p class="subtitle">Future Soldier | Web Developer | कमांडो</p>
        
        <!-- तुम्हारी वर्दी वाली फोटो -->
        <img src="https://i.postimg.cc/3xK1kK8P/wa-image-7182631443811397409.jpg" alt="Gagan in Uniform" class="profile-pic">

        <button class="btn" onclick="alert('जय हिंद कमांडो! देश सेवा के लिए तैयार हूं')">मुझसे मिलो</button>
        <button class="btn" onclick="window.open('https://instagram.com')">Instagram</button>

        <footer>
            <p>भारत माता की जय! 🇮🇳</p>
        </footer>
    </div>
</body>
