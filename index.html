<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Gagan - Future Soldier 🇮🇳</title>
    <style>
        body{
            background: linear-gradient(to bottom, #FF9933, #FFFFFF, #138808);
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container{
            background: white; 
            max-width: 500px; width: 100%;
            padding: 30px; 
            border-radius: 20px; 
            border: 4px solid #000080;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1{color: #FF4500; font-size: 28px;}
        .flag-box{
            width: 100%; height: 280px;
            border: 3px solid #000080;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
        }
        .flag-box img{
            width: 100%; height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>जय हिंद! मैं Gagan हूं 🇮🇳</h1>
        
        <div class="flag-box">
            <img src="tiranga.jpg" alt="Indian Flag HD">
        </div>
        
        <p><b>Future Soldier</b></p>
    </div>
</body>
</html>
