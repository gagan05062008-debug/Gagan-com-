<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagan - Future Soldier 🇮🇳</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        body{
            background: linear-gradient(135deg, #FF9933 33%, #FFFFFF 33%, #FFFFFF 66%, #138808 66%);
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container{
            max-width: 650px;
            width: 100%;
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            border: 5px solid #000080;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1{
            color: #FF4500;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .profile-pic{
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 8px solid #FF4500;
            object-fit: cover;
            margin: 20px auto;
            box-shadow: 0 0 20px rgba(255,69,0,0.5);
        }
        .badge{
            background: #000080;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin: 10px 0;
            font-weight: bold;
        }
        p{
            color: #333;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>जय हिंद! मैं Gagan हूं 🇮🇳</h1>
        
        <!-- YAHAN APNI PHOTO KA NAAM DALO -->
        <img src="wa_image_3538979385156026726.jpg" alt="Gagan in Army Uniform HD" class="profile-pic">
        
        <div class="badge">Future Soldier</div>
        <p>Web Developer | Proud Indian</p>
    </div>
</body>
</html>
